<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فهرس الكتّاب | منصة حدوش للأدب والثقافة</title><meta name="description" content="فهرس كتّاب منصة حدوش للأدب والثقافة وملفاتهم وأعمالهم المنشورة."><meta name="robots" content="index,follow"><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="container"><nav><a class="brand" href="/haddouche-literature-platform/index.html"><span class="mark">ح</span><span><strong>منصة حدوش للأدب والثقافة</strong><small>حيث تجد الكلمة مكانها</small></span></a><button class="menu-btn" aria-label="القائمة">☰</button><div class="links"></div></nav></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">الفهارس</div><h1>فهرس الكتّاب</h1><p>تعرّف إلى كتّاب المنصة، بلدانهم، وملفاتهم الأدبية والثقافية.</p><div id="writers-index" class="grid"></div></div></section></main>
<script>
Promise.all([fetch('assets/writers.json').then(r=>r.json()),fetch('assets/articles.json').then(r=>r.json())]).then(([writers,articles])=>{
 const box=document.getElementById('writers-index');
 box.innerHTML=writers.map(w=>{
  const n=articles.filter(a=>a.author===w.name).length;
  return '<a class="card index-card" href="writers/'+w.slug+'.html"><span class="tag">'+w.country+'</span><h3>'+w.name+'</h3><p>'+w.bio+'</p><div class="meta"><span>'+w.role+'</span><span>•</span><span>'+n+' نص منشور</span></div></a>';
 }).join('') || '<div class="empty-state">لا يوجد كتّاب مضافون بعد.</div>';
});
</script><footer><div class="container"><div class="copyright">© 2026 منصة حدوش للأدب والثقافة — جميع الحقوق محفوظة.</div></div></footer><script src="assets/site.js"></script></body></html>
