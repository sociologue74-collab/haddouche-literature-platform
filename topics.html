<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فهرس الموضوعات | منصة حدوش للأدب والثقافة</title><meta name="description" content="فهرس موضوعات ووسوم النصوص المنشورة في منصة حدوش للأدب والثقافة."><meta name="robots" content="index,follow"><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="container"><nav><a class="brand" href="/haddouche-literature-platform/index.html"><span class="mark">ح</span><span><strong>منصة حدوش للأدب والثقافة</strong><small>حيث تجد الكلمة مكانها</small></span></a><button class="menu-btn" aria-label="القائمة">☰</button><div class="links"></div></nav></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">الفهارس</div><h1>فهرس الموضوعات</h1><p>تُجمع الموضوعات تلقائيًا من الكلمات المفتاحية والوسوم المرتبطة بالنصوص المنشورة.</p><div id="topics-index" class="topic-cloud"></div></div></section></main>
<script>
fetch('assets/articles.json').then(r=>r.json()).then(items=>{
 const counts={};
 items.forEach(a=>(a.tags||[]).forEach(t=>counts[t]=(counts[t]||0)+1));
 const list=Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'));
 const box=document.getElementById('topics-index');
 box.innerHTML=list.length?list.map(([t,n])=>'<a class="topic-pill" href="search.html?q='+encodeURIComponent(t)+'">'+t+' <small>'+n+'</small></a>').join(''):'<div class="empty-state">لا توجد موضوعات مفهرسة بعد. ستظهر هنا تلقائيًا عند نشر أول النصوص.</div>';
});
</script><footer><div class="container"><div class="copyright">© 2026 منصة حدوش للأدب والثقافة — جميع الحقوق محفوظة.</div></div></footer><script src="assets/site.js"></script></body></html>
