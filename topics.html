<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الموضوعات | منصة حدوش للأدب والثقافة</title><meta name="description" content="فهرس الموضوعات والكلمات المفتاحية في منصة حدوش للأدب والثقافة."><meta name="robots" content="index,follow"><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="container"><nav><a class="brand" href="/haddouche-literature-platform/index.html"><span class="mark">ح</span><span><strong>منصة حدوش للأدب والثقافة</strong><small>حيث تجد الكلمة مكانها</small></span></a><button class="menu-btn" aria-label="القائمة">☰</button><div class="links"></div></nav></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">فهرس موضوعي</div><h1>الموضوعات</h1><p>تصفح النصوص بحسب الكلمات المفتاحية والموضوعات.</p><div id="topics-index"></div></div></section>
<script>fetch('assets/articles.json').then(r=>r.json()).then(articles=>{const tags={};articles.forEach(a=>(a.tags||[]).forEach(t=>tags[t]=(tags[t]||0)+1));const items=Object.entries(tags).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ar'));const box=document.getElementById('topics-index');box.innerHTML=items.length?'<div class="topic-cloud">'+items.map(([t,n])=>'<a class="topic-pill" href="search.html?q='+encodeURIComponent(t)+'">'+t+' <small>'+n+'</small></a>').join('')+'</div>':'<div class="empty-state">ستظهر الموضوعات هنا تلقائيًا بعد نشر أول نص.</div>'})</script></main><footer><div class="container"><div class="copyright">© 2026 منصة حدوش للأدب والثقافة — جميع الحقوق محفوظة.</div></div></footer><script src="assets/site.js"></script></body></html>
