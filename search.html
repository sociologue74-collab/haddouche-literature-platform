<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البحث | منصة حدوش</title><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="container"><nav><a class="brand" href="index.html"><span class="mark">ح</span><strong>منصة حدوش للأدب والثقافة</strong></a></nav></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">البحث داخل المنصة</div><h1>ابحث في النصوص</h1><div class="searchbox"><input id="q" type="search" placeholder="اكتب عنوانًا أو كلمة…"><button class="btn primary" onclick="runSearch()">بحث</button></div><div id="results"></div></div></section></main><script>let articles=[];const params=new URLSearchParams(location.search);const initial=params.get('q')||'';fetch('assets/articles.json').then(r=>r.json()).then(x=>{articles=x;if(initial){q.value=initial;runSearch()}else render(x)});function render(list){results.innerHTML=list.length?'<div class="grid">'+list.map(a=>'<a class="card" href="articles/'+a.slug+'/index.html"><span class="tag">'+a.category+'</span><h3>'+a.title+'</h3><p>'+a.excerpt+'</p></a>').join('')+'</div>':'<div class="empty-state">لا توجد نصوص منشورة حاليًا.</div>'}function runSearch(){let s=q.value.trim().toLowerCase();render(articles.filter(a=>(a.title+' '+a.excerpt+' '+a.author+' '+(a.tags||[]).join(' ')+' '+(a.category||'')).toLowerCase().includes(s)))}</script><script src="assets/site.js"></script></body></html>
