<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البلدان | منصة حدوش للأدب والثقافة</title><meta name="description" content="تصفح كتّاب ونصوص منصة حدوش للأدب والثقافة بحسب البلدان العربية."><meta name="robots" content="index,follow"><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="container"><nav><a class="brand" href="/haddouche-literature-platform/index.html"><span class="mark">ح</span><span><strong>منصة حدوش للأدب والثقافة</strong><small>حيث تجد الكلمة مكانها</small></span></a><button class="menu-btn" aria-label="القائمة">☰</button><div class="links"></div></nav></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">الفهارس</div><h1>البلدان</h1><p>دليل جغرافي للكتّاب المشاركين في المنصة، يتوسع تلقائيًا مع انضمام كتّاب من بلدان عربية جديدة.</p><div id="countries-index" class="grid"></div></div></section></main>
<script>
Promise.all([fetch('assets/writers.json').then(r=>r.json()),fetch('assets/articles.json').then(r=>r.json())]).then(([writers,articles])=>{
 const groups={};
 writers.forEach(w=>{if(!groups[w.country])groups[w.country]=[];groups[w.country].push(w)});
 const box=document.getElementById('countries-index');
 const entries=Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0],'ar'));
 box.innerHTML=entries.map(([country,list])=>{
  const names=list.map(w=>'<a class="inline-link" href="writers/'+w.slug+'.html">'+w.name+'</a>').join('، ');
  const count=articles.filter(a=>list.some(w=>w.name===a.author)).length;
  return '<div class="card index-card"><span class="tag">بلد</span><h3>'+country+'</h3><p>'+names+'</p><div class="meta"><span>'+list.length+' كاتب</span><span>•</span><span>'+count+' نص منشور</span></div></div>';
 }).join('') || '<div class="empty-state">سيظهر فهرس البلدان عند إضافة الكتّاب.</div>';
});
</script><footer><div class="container"><div class="copyright">© 2026 منصة حدوش للأدب والثقافة — جميع الحقوق محفوظة.</div></div></footer><script src="assets/site.js"></script></body></html>
