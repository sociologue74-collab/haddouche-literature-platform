<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>البلدان | منصة حدوش للأدب والثقافة</title><meta name="description" content="فهرس البلدان والكتّاب المشاركين في منصة حدوش للأدب والثقافة."><meta name="robots" content="index,follow"><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="container"><nav><a class="brand" href="/haddouche-literature-platform/index.html"><span class="mark">ح</span><span><strong>منصة حدوش للأدب والثقافة</strong><small>حيث تجد الكلمة مكانها</small></span></a><button class="menu-btn" aria-label="القائمة">☰</button><div class="links"></div></nav></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">فهرس جغرافي</div><h1>البلدان</h1><p>استكشف الكتّاب والنصوص بحسب البلد.</p><div id="countries-index"></div></div></section>
<script>Promise.all([fetch('assets/writers.json').then(r=>r.json()),fetch('assets/articles.json').then(r=>r.json())]).then(([writers,articles])=>{const box=document.getElementById('countries-index');const countries=[...new Set(writers.map(w=>w.country))].sort((a,b)=>a.localeCompare(b,'ar'));box.innerHTML=countries.length?'<div class="grid">'+countries.map(c=>{const ws=writers.filter(w=>w.country===c);const names=ws.map(w=>w.name).join('، ');const count=articles.filter(a=>ws.some(w=>w.name===a.author)).length;return '<div class="card"><span class="tag">بلد</span><h3>'+c+'</h3><p>'+names+'</p><div class="meta"><span>'+ws.length+' كاتب</span><span>•</span><span>'+count+' نص</span></div></div>'}).join('')+'</div>':'<div class="empty-state">لا توجد بلدان مسجلة بعد.</div>'})</script></main><footer><div class="container"><div class="copyright">© 2026 منصة حدوش للأدب والثقافة — جميع الحقوق محفوظة.</div></div></footer><script src="assets/site.js"></script></body></html>
