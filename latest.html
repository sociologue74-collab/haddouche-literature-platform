<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أحدث النصوص | منصة حدوش للأدب والثقافة</title><meta name="description" content="أحدث النصوص الأدبية والفكرية والثقافية المنشورة في منصة حدوش."><meta name="robots" content="index,follow"><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="container"><nav><a class="brand" href="/haddouche-literature-platform/index.html"><span class="mark">ح</span><span><strong>منصة حدوش للأدب والثقافة</strong><small>حيث تجد الكلمة مكانها</small></span></a><button class="menu-btn" aria-label="القائمة">☰</button><div class="links"></div></nav></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">جديد المنصة</div><h1>أحدث النصوص</h1><p>آخر ما نُشر في المنصة مرتبًا من الأحدث إلى الأقدم.</p><div id="latest-index"></div></div></section></main>
<script>
fetch('assets/articles.json').then(r=>r.json()).then(items=>{
 const list=[...items].sort((a,b)=>(b.published_at||'').localeCompare(a.published_at||''));
 const box=document.getElementById('latest-index');
 box.innerHTML=list.length?'<div class="grid">'+list.map(a=>'<a class="card" href="articles/'+a.slug+'/index.html"><span class="tag">'+(a.category||'نص')+'</span><h3>'+a.title+'</h3><p>'+a.excerpt+'</p><div class="meta"><span>'+a.author+'</span>'+(a.country?'<span>•</span><span>'+a.country+'</span>':'')+(a.published_at?'<span>•</span><span>'+a.published_at+'</span>':'')+'</div></a>').join('')+'</div>':'<div class="empty-state">لا توجد نصوص منشورة حاليًا. ستظهر هنا النصوص الجديدة فور نشرها.</div>';
});
</script><footer><div class="container"><div class="copyright">© 2026 منصة حدوش للأدب والثقافة — جميع الحقوق محفوظة.</div></div></footer><script src="assets/site.js"></script></body></html>
